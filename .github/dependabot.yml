# Proposes updates to the pinned Python packages as pull requests (v1.11.1). Each .txt is
# compiled from the .in beside it with hashes (pip-compile); Dependabot updates both. CI then
# checks the update like any other change. Monthly, so updates arrive in batches.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"                # requirements-test.in / .txt (test_midi.py, the compare test)
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: "/docs"            # requirements-manual.in / .txt (the manual and books to PDF)
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: "/docs/figures"    # requirements.in / .txt (the figures)
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
