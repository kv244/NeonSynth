name: Build

on:
  push:
    branches: [master, main, 'v[0-9]+']   # v17, not v17-p3: a PR's own branch is tested by pull_request alone
  pull_request:
    branches: [master, main, 'v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Install required system dependencies
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y \
            cmake ninja-build ccache mold \
            libasound2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libglib2.0-dev libgl1-mesa-dev libgtk-3-dev \
            xvfb

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: /tmp/JUCE
          key: juce-${{ runner.os }}-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git /tmp/JUCE

      # v1.11.1: a compile cache. JUCE and most sources do not change between runs, so a run
      # only compiles what a pull request touched. Restored from the newest cache of this job.
      - name: Compile cache settings (500 MB, GitHub keeps 10 GB per repository; the precompiled header)
        run: |
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"   # lets ccache cache files compiled with the precompiled header

      - name: Cache compiled objects (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-build-${{ runner.os }}-juce-9.0.0-${{ github.sha }}
          restore-keys: ccache-build-${{ runner.os }}-juce-9.0.0-

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja \
            -DJUCE_DIR=/tmp/JUCE \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEONSYNTH_BUILD_TESTS=ON \
            -DNEONSYNTH_WARNINGS_AS_ERRORS=ON \
            -DNEONSYNTH_LTO=OFF   # the Windows job tests the shipped (LTO) build

      - name: Build VST3 and unit tests
        run: cmake --build build --target NeonSynth_VST3 unit_tests

      - name: Compile cache statistics
        run: ccache --show-stats || true

      - name: Unit tests (GCC)
        run: xvfb-run -a ctest --test-dir build --output-on-failure   # EditorTests needs an X display

  # The unit tests again, built with AddressSanitizer and UndefinedBehaviorSanitizer
  # (NEONSYNTH_SANITIZE): a memory error or undefined behaviour anywhere in the tests,
  # including StateFuzzTests' damaged sessions, fails the job. Debug, so there is no LTO and
  # JUCE's assertions are on. Warnings are not errors here: the instrumentation makes GCC
  # warn about code that is clean in the normal build (the build job checks warnings).
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Install required system dependencies
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y \
            cmake ninja-build ccache mold \
            libasound2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libglib2.0-dev libgl1-mesa-dev libgtk-3-dev \
            xvfb

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: /tmp/JUCE
          key: juce-${{ runner.os }}-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git /tmp/JUCE

      # v1.11.1: a compile cache. JUCE and most sources do not change between runs, so a run
      # only compiles what a pull request touched. Restored from the newest cache of this job.
      - name: Compile cache settings (500 MB, GitHub keeps 10 GB per repository; the precompiled header)
        run: |
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"   # lets ccache cache files compiled with the precompiled header

      - name: Cache compiled objects (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-sanitizers-${{ runner.os }}-juce-9.0.0-${{ github.sha }}
          restore-keys: ccache-sanitizers-${{ runner.os }}-juce-9.0.0-

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja \
            -DJUCE_DIR=/tmp/JUCE \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEONSYNTH_BUILD_TESTS=ON \
            -DNEONSYNTH_SANITIZE=ON

      - name: Build unit tests
        run: cmake --build build --target unit_tests

      - name: Unit tests (ASan + UBSan)
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  # v1.12.0: the unit tests under ThreadSanitizer (NEONSYNTH_TSAN), Clang, Debug. The audio and
  # message threads share state without locks (the wavetable hand-off, the scope FIFO, the
  # sample slot, CHOP's pattern); a data race in NeonSynth's code fails the job.
  # tests/tsan-suppressions.txt may list reports inside JUCE only, each with its reason.
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Install required system dependencies
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y \
            cmake ninja-build ccache mold clang \
            libasound2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libglib2.0-dev libgl1-mesa-dev libgtk-3-dev \
            xvfb

      # The sanitizer runtime is a separate package for the installed Clang version.
      - name: Clang's sanitizer runtime
        run: sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      # TSan's shadow memory needs the older address-space randomisation range on newer kernels.
      - name: Address-space randomisation for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: /tmp/JUCE
          key: juce-${{ runner.os }}-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git /tmp/JUCE

      - name: Compile cache settings (500 MB, GitHub keeps 10 GB per repository; the precompiled header)
        run: |
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"   # lets ccache cache files compiled with the precompiled header

      - name: Cache compiled objects (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-tsan-${{ runner.os }}-juce-9.0.0-${{ github.sha }}
          restore-keys: ccache-tsan-${{ runner.os }}-juce-9.0.0-

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DJUCE_DIR=/tmp/JUCE \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEONSYNTH_BUILD_TESTS=ON \
            -DNEONSYNTH_TSAN=ON

      - name: Build unit tests
        run: cmake --build build --target unit_tests

      - name: Unit tests (ThreadSanitizer)
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  # v1.12.0: line coverage of src/ by the unit tests, on every pull request (Clang source-based
  # coverage, NEONSYNTH_COVERAGE). No threshold yet: the job reports, it does not judge. The
  # per-file table goes to the job summary and the HTML report is kept as an artifact.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Install required system dependencies
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y \
            cmake ninja-build ccache mold clang llvm \
            libasound2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libglib2.0-dev libgl1-mesa-dev libgtk-3-dev \
            xvfb

      # The profile runtime is a separate package for the installed Clang version.
      - name: Clang's profile runtime
        run: sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: /tmp/JUCE
          key: juce-${{ runner.os }}-9.0.0

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git /tmp/JUCE

      - name: Compile cache settings (500 MB, GitHub keeps 10 GB per repository; the precompiled header)
        run: |
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"   # lets ccache cache files compiled with the precompiled header

      - name: Cache compiled objects (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830        # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-coverage-${{ runner.os }}-juce-9.0.0-${{ github.sha }}
          restore-keys: ccache-coverage-${{ runner.os }}-juce-9.0.0-

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DJUCE_DIR=/tmp/JUCE \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEONSYNTH_BUILD_TESTS=ON \
            -DNEONSYNTH_COVERAGE=ON

      - name: Build unit tests
        run: cmake --build build --target unit_tests

      - name: Unit tests, each writing its own profile
        run: LLVM_PROFILE_FILE="$PWD/build/profiles/%p.profraw" xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Coverage report
        run: |
          llvm-profdata merge -sparse build/profiles/*.profraw -o build/coverage.profdata
          objects=""
          for exe in build/*_artefacts/Debug/*; do
            [ -x "$exe" ] && objects="$objects -object $exe"
          done
          ignore='(/tmp/JUCE|/usr/|build/|tests/)'
          llvm-cov report $objects -instr-profile=build/coverage.profdata -ignore-filename-regex="$ignore" > build/coverage.txt
          llvm-cov show $objects -instr-profile=build/coverage.profdata -ignore-filename-regex="$ignore" \
            -format=html -output-dir=build/coverage-html
          {
            echo "### Line coverage of src/ by the unit tests"
            echo '```'
            cat build/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: coverage-html
          path: build/coverage-html
