name: Manual

# Checks the user manual and the two companion books (docs/theory) against the source and
# prints them to PDF.
#   * fails if "Applies to" or the cover does not name the version in CMakeLists.txt,
#     or a link/image is broken
#   * uploads the PDF as a build artifact (Actions run page, kept 30 days)
# A tagged release also attaches the PDF to the release (see release.yml).

on:
  push:
    branches: [master, main, 'v[0-9]+']   # v17, not v17-p3: a PR's own branch is tested by pull_request alone
    paths:
      - 'docs/**'
      - 'CMakeLists.txt'
      - '.github/workflows/manual.yml'
  pull_request:
    branches: [master, main, 'v[0-9]*']
    paths:
      - 'docs/**'
      - 'CMakeLists.txt'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'

      - name: Check the manual against the source
        run: python docs/build_manual.py --check

      - name: Check "The DSP Behind NeonSynth" against the source
        run: python docs/theory/build_book.py --check

      - name: Install the PDF tools
        run: |
          pip install -r docs/requirements-manual.txt
          # --with-deps installs Chromium's libraries and fonts through apt. When the runner can't
          # reach Ubuntu's package servers (PR #20 hit that three times in an hour), install the
          # browser alone: the runner image already carries Chrome's libraries.
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
          fc-list | grep -qiE 'liberation sans|dejavu sans' \
            || echo '::warning::Neither Liberation Sans nor DejaVu Sans is installed; the PDF falls back to another font'

      - name: Print the manual to PDF
        run: python docs/build_manual.py --out build/manual

      - name: Print "The DSP Behind NeonSynth" to PDF
        run: python docs/theory/build_book.py --out build/theory

      - name: Upload the PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: NeonSynth-User-Manual
          path: build/manual/*.pdf
          retention-days: 30

      - name: Upload the book
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: The-DSP-Behind-NeonSynth
          path: build/theory/*.pdf
          retention-days: 30

  # The Mathematical Compendium is LaTeX; its build script fails if the .tex names another minor
  # version (an edition for v1.11.0 holds for v1.11.x, like the book; see build_book.py).
  compendium:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Install LaTeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Build the Mathematical Compendium
        run: bash docs/theory/build_compendium.sh build/theory

      - name: Upload the PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: Mathematical-Compendium
          path: build/theory/*.pdf
          retention-days: 30
